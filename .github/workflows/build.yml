name: build

# CI for the macOS app + engine. Builds on every push/PR so a broken commit is
# caught before release. (Notarization is a separate, credentialed step — see
# SECURITY.md — and is intentionally not run here.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest   # Apple Silicon runner, ships Swift via Xcode (pinned versions get retired)
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swiftc --version

      - name: Lint Python service
        run: python3 -m py_compile ups_print_bridge.py

      - name: Security test Python service (fake lp, no printer)
        run: |
          printf '#!/bin/sh\nfor a; do f="$a"; done\ncat "$f" >> /tmp/printed.zpl\n' > /tmp/fake-lp
          chmod +x /tmp/fake-lp; rm -f /tmp/printed.zpl
          UPS_BRIDGE_PORT=4398 UPS_BRIDGE_LP=/tmp/fake-lp UPS_BRIDGE_LOG=/tmp/bridge.log python3 ups_print_bridge.py &
          PID=$!; sleep 2
          B=http://127.0.0.1:4398
          code(){ curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # arbitrary websites must be blocked
          test "$(code -X POST $B/print -H 'Origin: https://evil.example' -H 'Content-Type: text/plain' --data '^XA^FDevil^XZ')" = 403
          test "$(code -X POST $B/print -H 'Origin: https://ups.com.evil.com' --data 'labelBytes=XlhBXlha')" = 403
          # GET with ZPL in the query (an <img> tag) must never print
          curl -s "$B/listPrinters?x=%5EXA%5EFDevilget%5EXZ" >/dev/null
          # ups.com, the local handshake page and local tools can print
          test "$(code -X POST $B/print -H 'Origin: https://www.ups.com' -H 'Content-Type: application/json' --data '{"data":"^XA^FDups^XZ"}')" = 200
          test "$(code -X POST $B/print -H 'Origin: http://127.0.0.1:4398' --data 'labelBytes=XlhBXkZEbG9jYWxeWFo=')" = 200
          kill $PID
          if grep -q evil /tmp/printed.zpl; then echo "blocked label was printed"; exit 1; fi
          grep -q '\^FDups' /tmp/printed.zpl
          grep -q '\^FDlocal' /tmp/printed.zpl
          # label contents must not end up in the log (personal data)
          if grep -q '\^FD' /tmp/bridge.log; then echo "label contents leaked to log"; exit 1; fi

      - name: Build engine (headless CLI)
        run: |
          cd macos-app
          ./build-cli.sh
          test -f build/ups-bridge-cli

      - name: Build app bundle
        run: |
          cd macos-app
          ./build-app.sh
          test -d "build/UPS Print Bridge.app/Contents/MacOS"
          test -f "build/UPS Print Bridge.app/Contents/Info.plist"

      - name: Smoke test the engine (start, ping, stop)
        run: |
          cd macos-app
          UPS_BRIDGE_PRINTER=__ci_no_printer__ ./build/ups-bridge-cli &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:4349/ping
          # arbitrary web origin must be blocked from printing.
          # labelBytes=XlhBXlha is base64 of "^XA^XZ" (valid ZPL → reaches the
          # origin gate; with a non-allowed origin it must return 403).
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:4349/print \
                 -H "Origin: https://evil.example" -H "Content-Type: application/x-www-form-urlencoded" \
                 --data 'labelBytes=XlhBXlha')
          test "$code" = "403" || (echo "expected 403 for evil origin, got $code" && exit 1)
          kill $PID

      - name: Package app as zip artifact
        run: |
          cd macos-app/build
          ditto -c -k --keepParent "UPS Print Bridge.app" "UPS-Print-Bridge.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: UPS-Print-Bridge-macos
          path: macos-app/build/UPS-Print-Bridge.zip
          if-no-files-found: error
